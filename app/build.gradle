plugins {
    id 'com.android.application'
}

android {
    namespace 'com.openai.flagsecure.compat'
    compileSdk 36

    defaultConfig {
        applicationId 'com.openai.flagsecure.compat'
        minSdk 26

        // Keep a conservative targetSdk for the tiny module APK itself.
        // The module runs inside the patched target app process under LSPatch.
        targetSdk 30

        versionCode 2
        versionName '2.1.0-lspatch487-safe1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    compileOnly files('libs/xposed-api-stubs.jar')
}
